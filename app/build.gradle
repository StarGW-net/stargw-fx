apply plugin: 'com.android.application'

android {
    compileSdk 35

    defaultConfig {
        applicationId "net.stargw.fx"
        minSdkVersion 30
        targetSdk 35
        versionCode 15
        versionName "15"
    }

    buildTypes {
        release {
			
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
			
			minifyEnabled true
			shrinkResources true

			packagingOptions {
				resources {
					excludes += "/assets/dexopt/baseline.prof"
				}
			}


            // Tell packaging options to exclude the profile binary entirely
            packagingOptions {
                resources {
                    excludes += "/assets/dexopt/baseline.prof"
                }
            }
        }
    }
    namespace 'net.stargw.fx'
    lint {
        abortOnError false
    }
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "${applicationId}-${variant.buildType.name}-v${defaultConfig.versionName}.apk"
            Task swTask = project.task("zzz${variant.name}", type: Copy) {
                from output.outputFile.getParent()
                into file("apks")
                include output.outputFileName
                // rename(output.outputFileName, "${applicationId}-${variant.buildType.name}-v${defaultConfig.versionName}.apk")
                rename(output.outputFileName,output.outputFileName)
            }
            variant.assemble.finalizedBy(swTask)
        }
    }
    
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    implementation "androidx.work:work-runtime:2.11.2"
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}


